# Name of the GitHub Actions workflow
name: AI Morning Brief Agent

# Allow manual workflow execution
on:
  workflow_dispatch:

jobs:
  morning-brief:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install required libraries
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: Run weather and market analysis
      - name: Run Morning Brief
        run: python src/main.py

      # Step 5: Investigate unusual stocks using Gemini
      - name: Run AI Stock Investigation
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python src/run_ai_brief.py

      # Step 6: Generate personalized news briefing
      - name: Run Personalized News Briefing
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python src/news_brief.py
