# Automated AI Morning Brief
name: AI Morning Brief Agent

on:
  # Run manually whenever needed
  workflow_dispatch:

  # Run every morning automatically
  schedule:
    # 12:00 UTC = 7 AM EST / 8 AM EDT
    - cron: "0 12 * * *"

jobs:
  morning-brief:
    runs-on: ubuntu-latest

    # Prevent the workflow from running indefinitely
    timeout-minutes: 40

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install required libraries
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: Generate and email the morning brief
      - name: Generate and Send Morning Brief
        env:
          # Gemini AI credentials
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash

          # Gmail credentials
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

          # Display Python output immediately
          PYTHONUNBUFFERED: "1"

        run: python src/send_email.py
